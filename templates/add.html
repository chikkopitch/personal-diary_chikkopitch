{% extends 'base.html' %}

{% block content %}
  <h2>Новая запись</h2>
  <form method="post" class="entry-form">
    <p>
      <label>Заголовок:<br>
        <input type="text" name="title" required>
      </label>
    </p>
    <p>
      <label>Текст:<br>
        <textarea name="content" rows="10" required></textarea>
      </label>
    </p>
    <p>
      <button class="btn" type="submit">Сохранить</button>
      <a class="btn" href="/">Отмена</a>
    </p>
  </form>
{% endblock %}
