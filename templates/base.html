<!doctype html>
<html lang="ru">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Личный дневник</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Личный дневник</h1>
      <nav class="main-nav">
        <a href="/">Главная</a>

    <footer>
      <hr>
      <p>Автор: Не указан</p>
    </footer>
  </div>
</body>
</html>
