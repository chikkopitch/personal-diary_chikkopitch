{% extends 'base.html' %}

{% block content %}
  <h2>Редактировать запись</h2>
  <form method="post">
    <p><label>Заголовок:<br><input name="title" value="{{ entry.title }}"></label></p>
    <p><label>Содержимое:<br><textarea name="content" rows="6">{{ entry.content }}</textarea></label></p>
    <p><button type="submit">Сохранить</button></p>
  </form>
{% endblock %}
