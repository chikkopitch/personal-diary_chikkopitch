{% extends 'base.html' %}

{% block content %}
  <h2>Мои записи</h2>
  {% if entries %}
    <div class="entries-list">
      {% for entry in entries %}
        <div class="card">
          <h3>{{ entry.title }}</h3>
          {% if entry.date %}
            <div class="meta">{{ entry.date }}</div>
          {% endif %}
          <div class="actions">
            <a class="btn" href="/entry/{{ loop.index0 }}">Читать</a>
            <a class="btn" href="/edit/{{ loop.index0 }}">Редактировать</a>
            <form action="/delete/{{ loop.index0 }}" method="post" style="display:inline">
              <button class="btn danger" type="submit">Удалить</button>
            </form>
          </div>
        </div>
      {% endfor %}
    </div>
  {% else %}
    <p>Пока нет записей. Создайте первую!</p>
  {% endif %}
{% endblock %}
